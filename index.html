<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center mt-5">Inscrivez-vous</h1>
<div class="container mt-5 center border rounded p-3 w-50">
    <form action="api/inscrire.php" method="post" enctype="multipart/form-data">

        <label for="nom" class="form-label mt-2">Nom :</label>
        <input type="text" name="nom" class="form-control" required>

        <label for="pnom" class="form-label mt-2">Prenom :</label>
        <input type="text" name="pnom" class="form-control" required>

        <label for="ville" class="form-label mt-2">Ville :</label>
        <input type="text" name="ville" class="form-control" required>
        
        <label for="img" class="form-label mt-2">Image :</label>
        <input type="file" name="img" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp" required>

        <input type="submit" value="Submit" class="btn btn-primary mt-2">
    </form>
    <a href="liste.html" class="btn btn-secondary mt-2">Voir la liste des stagiaires</a>
</div>
</body>
</html>
